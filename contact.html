<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Contact Joy Christos."><title>Contact | Joy Christos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body class="inner-page">
  <header class="site-header"><a class="wordmark" href="index.html">JOY CHRISTOS</a><nav aria-label="Primary navigation"><a href="about.html">About</a><a href="contact.html">Contact</a></nav></header>
  <main class="inner-main contact-main">
    <section class="inner-copy">
      <p class="kicker">Bookings & collaborations</p><h1>Contact</h1>
      <p class="lede">Have a role, room, or story in mind? Let’s talk.</p>
      <form class="contact-form" action="https://formsubmit.co/joychristosvoice@gmail.com" method="POST">
        <input type="hidden" name="_subject" value="New Joy Christos website inquiry">
        <input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false">
        <div><label for="name">Name</label><input id="name" name="name" autocomplete="name" required></div>
        <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div><label for="message">Tell us about the project</label><textarea id="message" name="message" rows="4" required></textarea></div>
        <button type="submit">Send inquiry</button>
      </form>
      <a class="back-link" href="index.html">← Back home</a>
    </section>
  </main><script src="script.js"></script>
</body></html>
