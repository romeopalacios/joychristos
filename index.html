<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Joy Christos — actor, comedian, and storyteller."><title>Joy Christos</title>
  <script>try{document.documentElement.classList.add(sessionStorage.getItem('joyIntroPlayed')?'skip-intro':'is-loading')}catch(e){document.documentElement.classList.add('is-loading')}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="intro" aria-hidden="true">
    <div class="signature-writing exact-signature"><canvas class="signature-canvas" width="1210" height="1060"></canvas><img class="signature-final" src="assets/signature-ink.png" alt="" width="1210" height="1060"></div>
    <p>Joy Christos</p>
  </div>
  <header class="site-header"><a class="wordmark" href="index.html" aria-label="Joy Christos home">JOY CHRISTOS</a><nav aria-label="Primary navigation"><a href="about.html">About</a><a href="contact.html">Contact</a></nav></header>
  <main>
    <section class="panel hero" id="home">
      <div class="panel-number">01 / 03</div>
      <div class="media-frame youtube-frame reveal"><iframe src="https://www.youtube-nocookie.com/embed/Oq8a6v9V0Hs?rel=0&modestbranding=1" title="Joy Christos featured video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>
      <a class="scroll-cue" href="#comedy" aria-label="Scroll to comedy section"><span></span>Scroll</a>
    </section>
    <section class="panel comedy" id="comedy">
      <div class="panel-shade"></div>
      <div class="panel-number">02 / 03</div>
      <div class="media-frame local-frame reveal">
        <video controls playsinline preload="metadata"><source src="assets/comedy-film.mov" type="video/quicktime"><source src="comedy background/comedy movie.MOV" type="video/mp4">Your browser does not support embedded video.</video>
        <button class="video-curtain" type="button" aria-label="Open the curtains and play comedy video">
          <span class="mini-curtain mini-curtain-left"></span><span class="mini-curtain mini-curtain-right"></span>
          <span class="curtain-play" aria-hidden="true">▶</span>
        </button>
      </div>
    </section>
    <section class="panel gallery-panel" id="gallery">
      <div class="panel-shade"></div>
      <div class="gallery-heading reveal"><h2>Gallery</h2></div>
      <div class="gallery-track" aria-label="Joy Christos photo gallery" tabindex="0">
        <figure><img src="assets/gallery-01-web.jpg" alt="Joy Christos portrait" loading="lazy" decoding="async"><figcaption>Portraits / 01</figcaption></figure>
        <figure><img src="assets/gallery-02-web.jpg" alt="Joy Christos editorial portrait" loading="lazy" decoding="async"><figcaption>Editorial / 02</figcaption></figure>
        <figure><img src="assets/gallery-03-web.jpg" alt="Joy Christos behind the scenes" loading="lazy" decoding="async"><figcaption>Behind the scenes / 03</figcaption></figure>
      </div>
      <div class="drag-note">Drag to explore <span>→</span></div>
      <footer class="panel-footer"><span>© <span data-year></span> Joy Christos</span><a href="contact.html">Let’s work together</a></footer>
    </section>
  </main><script src="script.js"></script>
</body></html>
